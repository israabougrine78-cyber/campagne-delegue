<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificateur d'Évaluations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e8b4d9 0%, #d9a8d9 50%, #d9e8f5 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            border: 3px solid #d9a8d9;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #d9a8d9;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #d9e8f5;
            border-radius: 15px;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d9a8d9;
            box-shadow: 0 0 8px rgba(217, 168, 217, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #d9a8d9, #c4d9e8);
            color: white;
            border: 2px solid #d9a8d9;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 168, 217, 0.4);
        }

        .btn-reset {
            background: white;
            color: #d9a8d9;
            border: 2px solid #d9a8d9;
        }

        .btn-reset:hover {
            background: #f9f5fa;
        }

        .evaluations-list {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e8d9f5;
        }

        .eval-item {
            background: #f9f5fa;
            padding: 15px;
            border-radius: 15px;
            border-left: 4px solid #d9a8d9;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .eval-info {
            flex: 1;
        }

        .eval-subject {
            font-weight: bold;
            color: #d9a8d9;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .eval-details {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .eval-status {
            font-size: 20px;
            margin-left: 15px;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #d9a8d9;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Retour</a>
        
        <h1>Planificateur d'Évaluations</h1>
        <p class="subtitle">Suivi de tes dates d'examen et contrôles</p>

        <form id="evalForm">
            <div class="form-group">
                <label for="subject">Matière *</label>
                <input type="text" id="subject" name="subject" placeholder="Ex: Mathématiques" required>
            </div>

            <div class="form-group">
                <label for="type">Type d'évaluation *</label>
                <select id="type" name="type" required>
                    <option value="">-- Sélectionne un type --</option>
                    <option value="Contrôle">Contrôle</option>
                    <option value="Devoir">Devoir</option>
                    <option value="Examen">Examen</option>
                    <option value="Quiz">Quiz</option>
                    <option value="TP">TP</option>
                    <option value="Oral">Oral</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="chapter">Chapitre/Thème</label>
                <input type="text" id="chapter" name="chapter" placeholder="Ex: Électricité, Révolution française...">
            </div>

            <div class="form-group">
                <label for="duration">Durée (en minutes)</label>
                <input type="number" id="duration" name="duration" placeholder="Ex: 60">
            </div>

            <div class="form-group">
                <label for="remarks">Notes/Remarques</label>
                <textarea id="remarks" name="remarks" placeholder="Ex: Apporter la calculatrice, réviser le chapitre 3..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Ajouter l'évaluation</button>
                <button type="reset" class="btn-reset">Effacer le formulaire</button>
            </div>
        </form>

        <div class="evaluations-list" id="evalsList">
            <h2 style="color: #d9a8d9; margin-bottom: 20px;">Tes évaluations à venir</h2>
            <div id="evalContainer" class="empty-state">Aucune évaluation enregistrée pour le moment.</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'evaluations';

        function getEvaluations() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveEvaluations(evals) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(evals));
        }

        function getStatus(evalDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const evalDateObj = new Date(evalDate);
            const daysUntil = Math.ceil((evalDateObj - today) / (1000 * 60 * 60 * 24));

            if (daysUntil < 0) return '✅';
            if (daysUntil < 3) return '🔴';
            if (daysUntil < 7) return '🟠';
            return '✅';
        }

        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', options);
        }

        function renderEvaluations() {
            const evals = getEvaluations();
            const container = document.getElementById('evalContainer');

            if (evals.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucune évaluation enregistrée pour le moment.</div>';
                return;
            }

            const sorted = evals.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            container.innerHTML = sorted.map(eval => `
                <div class="eval-item">
                    <div class="eval-info">
                        <div class="eval-subject">${eval.subject} - ${eval.type}</div>
                        <div class="eval-details">
                            <div>📅 ${formatDate(eval.date)}</div>
                            ${eval.chapter ? `<div>📖 ${eval.chapter}</div>` : ''}
                            ${eval.duration ? `<div>⏱️ ${eval.duration} min</div>` : ''}
                            ${eval.remarks ? `<div>📝 ${eval.remarks}</div>` : ''}
                        </div>
                        <button class="btn-delete" onclick="deleteEval(${eval.id})">Supprimer</button>
                    </div>
                    <div class="eval-status">${getStatus(eval.date)}</div>
                </div>
            `).join('');
        }

        function deleteEval(id) {
            if (confirm('Tu es sûr(e) de vouloir supprimer cette évaluation ?')) {
                const evals = getEvaluations().filter(e => e.id !== id);
                saveEvaluations(evals);
                renderEvaluations();
            }
        }

        document.getElementById('evalForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const eval = {
                id: Date.now(),
                subject: formData.get('subject'),
                type: formData.get('type'),
                date: formData.get('date'),
                chapter: formData.get('chapter'),
                duration: formData.get('duration'),
                remarks: formData.get('remarks'),
                timestamp: new Date().toISOString()
            };

            const evals = getEvaluations();
            evals.push(eval);
            saveEvaluations(evals);

            this.reset();
            renderEvaluations();
        });

        // Render on page load
        renderEvaluations();
    </script>
</body>
</html>
